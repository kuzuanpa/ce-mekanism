# 原版配方（工作台/熔炉）—— mek.py generate 生成。
# 数据来自上游 datagen 的 data/*/recipe（摆位、数量、标签都按它），
# 标签成员见 02 第七节的 D5：c: 那类通用标签的成员在 tools/curation.yml 的 tags.common。
